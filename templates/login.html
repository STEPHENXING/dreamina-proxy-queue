<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算力共享平台 - 登录</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-panel">
    <h1>算力共享平台</h1>
    {% for message in flashes %}
      <p class="muted">{{ message }}</p>
    {% endfor %}
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}" class="stack">
      <label>用户名<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <label>验证码
        <div style="display: flex; gap: 10px; align-items: center;">
          <input name="captcha" type="text" autocomplete="off" required style="flex: 1;" placeholder="请输入右侧数字">
          <img src="{{ url_for('get_captcha') }}" onclick="this.src='{{ url_for('get_captcha') }}?'+Math.random()" style="cursor: pointer; height: 60px; border-radius: 4px;" title="点击刷新" alt="验证码">
        </div>
      </label>
      <button type="submit">登录</button>
    </form>
    <p class="muted" style="margin-top: 14px;">
      没有账号？<a href="{{ url_for('register') }}">点这里注册</a>
    </p>
  </main>
</body>
</html>
